# Build and lint on every push and PR. No signing here, that is release.yml,
# so this needs no secrets and runs on forks.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Build
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Clippy
        shell: pwsh
        run: |
          cargo clippy --release --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy failed" }

      # Four tests sat broken because nothing here ran them. The runner has an
      # interactive-enough session for the desktop and UI Automation tests; the
      # ones needing a disposable fixture process stay behind --ignored and are
      # run deliberately, not here.
      - name: Test
        shell: pwsh
        env:
          # A panic here is read from the log by someone who cannot reproduce
          # the runner, so an unwrapped Windows HRESULT with no frames above it
          # is not enough to act on.
          RUST_BACKTRACE: "1"
        run: |
          Write-Host "TEMP=$env:TEMP"
          Write-Host "resolved: $([System.IO.Path]::GetTempPath())"
          cargo test --bin MasterControlProgram
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }
          cargo test --test mcp
          if ($LASTEXITCODE -ne 0) { throw "integration tests failed" }

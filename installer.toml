# Windows 11 24H2. Not cosmetic: the server self-elevates through sudo, which
# does not exist before this build.
[[preflight]]
type = "os_build"
min  = 26100
fail = "Windows 11 24H2 (build 26100) or later is required. The server self-elevates through sudo, which older builds do not have."

# Catches the out-of-box state, where sudo has never been configured and the
# key does not exist at all.
#
# It cannot check that sudo is in Inline mode specifically: registry_value only
# tests presence or absence, so a box sitting in ForceNewWindow or DisableInput
# passes this and then fails at first launch. The server checks the actual mode
# on startup and refuses to run with the exact command to fix it, which is the
# real gate. This is only here to catch the common case earlier.
[[preflight]]
type   = "registry_value"
hive   = "HKLM"
key    = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Sudo'
name   = "Enabled"
expect = true
fail   = "sudo is not enabled. Open an admin terminal and run: sudo config --enable normal"

# No preflight for PowerShell 7, deliberately. file_exists does not expand
# {ProgramFiles}, and hardcoding C:\Program Files would block installs on any
# machine whose ProgramFiles is elsewhere. A check that produces a false
# refusal is worse than no check: the server reports a missing pwsh clearly
# enough at startup.

# Replacing the exe while a client holds it open fails the copy halfway.
[[preflight]]
type            = "process_not_running"
name            = "MasterControlProgram.exe"
restart_manager = true
fail            = "MasterControlProgram is running. Close any MCP client using it (Claude Desktop, Claude Code) and retry."

[[actions]]
type = "arp"
quiet_uninstall = true

# Client registration is the entire reason this installer exists: otherwise a
# user has to find a config file and hand-edit it, and on a Store install of
# Claude Desktop the path every guide gives them is the wrong one.
#
# Two clients are covered: Claude Desktop, and the shared Codex config that the
# ChatGPT desktop app, the Codex CLI and the Codex IDE extension all read.
#
# Bare --register takes whichever of them are on the box, which is the only
# form available here. Forge has no options page and hook args are fixed at
# build time, so there is no checkbox to read: the binary decides at run time,
# and prints what it skipped along with the flag to add it by hand later.
#
# The subcommand lives in the server binary rather than a helper script because
# hooks run a payload member as argv with no shell, and because "auto" pins the
# hook to this exact exe by digest.
[[hooks.post_install]]
id     = "register_mcp_clients"
run    = 'payload:MasterControlProgram.exe'
args   = ["--register"]
sha256 = "auto"
expect_exit = [0]
timeout_ms  = 30000
# Not vital. Neither client may be installed at all, and a working install of
# the server is still worth having for Claude Code and other MCP clients.
vital = false

[[hooks.pre_uninstall]]
id     = "unregister_mcp_clients"
run    = 'payload:MasterControlProgram.exe'
args   = ["--unregister"]
sha256 = "auto"
expect_exit = [0]
timeout_ms  = 30000
vital = false

# MasterControlProgram: a Windows system-control MCP server.
#
# Payload is a single self-contained exe, so there is no bin/ layout here and
# the shortcut action is deliberately absent: this is a headless stdio server
# launched by an MCP client, not something anyone double-clicks.

[product]
name         = "MasterControlProgram"
version      = "1.1.0"
publisher    = "Locke Werks"
description  = "Windows 11 system control over MCP. 98 tools, 37 direct Win32 syscalls, full computer use."
copyright    = "Copyright (c) 2026 Locke Werks"
url          = "https://github.com/lockewerks/MasterControlProgram"
# Stable across versions forever. Upgrade detection and the single-instance
# mutex key off this, so a new GUID next release turns an upgrade into a
# second, parallel install.
upgrade_code = "5bebe0d5-8705-4164-abd9-98be405f1895"
aumid        = "LockeWerks.MasterControlProgram"

[install]
scope = "machine"
dir   = '{ProgramFiles}\MasterControlProgram'
# on-demand, not required: this product hands an AI unrestricted control of the
# machine, and the warning below needs to be readable BEFORE a UAC prompt shows
# up. Consent after the fact is not consent.
elevation = "on-demand"

[ui]
warning = "This gives an AI full, unrestricted, root-level access to this machine: processes, registry, files, services, firewall, plus your screen, mouse and keyboard. There is no sandbox and no undo. Install it only if that is exactly what you want."
license_text = """
